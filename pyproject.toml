[project]
name = "iclr"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cma>=4.5.0",
    "coco-experiment>=2.8.2",
    "cocopp>=2.8.8",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv.workspace]
members = [
    "benchmarking/CMA-ES",
]
